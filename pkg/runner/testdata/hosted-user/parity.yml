name: hosted runner user parity
on: workflow_dispatch
jobs:
  hosted:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          test "$(id -u)" -ne 0
          test "$HOME" = /home/actrunner
          touch "$HOME/writable" "$GITHUB_WORKSPACE/writable"
          d=$(mktemp -d)
          chmod 500 "$d"
          if touch "$d/denied"; then exit 1; fi
          sudo -n true
      - uses: ./action
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
      - run: python -c 'import os; assert os.getuid() != 0' && uv --version
  explicit-container:
    runs-on: ubuntu-24.04
    container:
      image: docker.io/catthehacker/ubuntu@sha256:4f2d5083a9d10d018c1c511eb8665cd480553c11975e78fd903a46daa830768b
    steps:
      - run: test "$(id -u)" -eq 0
